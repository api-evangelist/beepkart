name: BeepKart

description: 'BeepKart was an Indian online marketplace for buying and selling used two‑wheelers. Founded in Bangalore, it raised approximately $18 million in funding and operated a platform connecting sellers and buyers of pre‑owned motorcycles and scooters. In 2024 the company ceased operations and began seeking to sell its assets, as reported by multiple news outlets. The platform is no longer active, and its website is offline.'

